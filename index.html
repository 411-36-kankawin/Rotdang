function setRoute(t,coords,mode){t.rt=coords.map(c=>[c[1],c[0]]);t.cum=[0];

t.len=t.cum[t.cum.length-1];t.s=0;t.si=0;t.mode=mode;t.pend=false;placeT(t)}
function placeT(t){const c=t.cum;let i=t.si;while(i<c.length-2&&c[i+1]<t.s)i++;t.si=i;
const a=t.rt[i],b=t.rt[i+1]||a,seg=(c[i+1]||c[i])-c[i]||1,f=Math.min(1,Math.max(0,(t.s-c[i])/seg));

function step(t,dt){if(!t.ready)return;const q=!!(S.req&&S.req.i===t.i&&S.o);let vt=0;

${S.stops.map((s,i)=>`<div class="sr"><span>จุดลง ${i+1}: ${s.name}<small>${t.legs[i].toFixed(1)} กม. จากจุดก่อนหน้า</small></span><button class="x" data-rm="${i}" aria-label="ลบจุดลง ${i+1}">✕</button></div>`).join('')}
${n?`<div class="box"><div class="pb">${n===1?`<span>ราคาแชร์<br><span class="big">฿${t.sh}</span> / คน</span>`:''}<span style="text-align:right">ราคาเหมาคัน<br><span class="big">฿${t.ch}</span></span></div><div class="meta" style="color:var(--sub);font-size:13px">รวม ${t.k.toFixed(1)} กม.${n>1?` · ลง ${n} จุด เหมาคันเท่านั้น (จุดที่เพิ่มคิด ฿20 ต่อจุด)`:''}</div><button class="btn" data-show="1">โชว์ให้คนขับดู</button></div>`:''}
<div class="meta" style="margin:8px 0;color:var(--sub);font-size:13px">${n<4?(n?'แตะแผนที่เพื่อเพิ่มจุดลงอีกที่':'แตะแผนที่เพื่อเลือกจุดลง หรือเลือกจากรายการ'):'ครบ 4 จุดแล้ว แตะแผนที่จะแทนที่จุดสุดท้าย'}</div>
${n?`<div class="fl">${P.map(p=>`<button data-add="${p.id}">+ ${p.s}</button>`).join('')}</div>`:list.map(({p,r})=>`<button class="rt" data-add="${p.id}"><span>${p.th}<small>${r.k.toFixed(1)} กม. · เหมาคัน ฿${r.c}</small></span><span class="p">฿${r.p}<small> / คน</small></span></button>`).join('')}
<h2 style="margin-top:14px">คนขับแถวนี้ (ใกล้${np.s})</h2>${ds.length?ds.map(d=>`<span class="dc">${d.n}</span>`).join(''):'<div class="sub">ยังไม่มีคนขับลงทะเบียนพื้นที่นี้</div>'}
<div class="foot">จุดรอ ราคา และคนขับเป็นข้อมูลตัวอย่าง ราคาเหมา ค่าจุดเพิ่ม และราคาไปอำเภอรอบเมืองต้องตกลงกับคนขับจริงก่อนใช้งาน<br>แผนที่: ${ATTR}</div>`}
function topHtml(){const dr=S.dr!==null?D[S.dr]:null,r=ref(),L=P.map(p=>({p,m:hav(r,p)})).sort((a,b)=>a.m-b.m);
return`<div class="pill"><span>รถแดงเชียงใหม่ · <b>ต้นแบบ ข้อมูลจำลอง</b></span><span class="cash">เงินสดเท่านั้น</span></div>
${dr?`<div class="chips"><button class="on" data-clr="1">แสดงพื้นที่ของ ${dr.n} ✕</button></div>`:`<div class="chips"><button data-me="1">ตำแหน่งฉัน</button>${L.map(({p},i)=>`<button class="${i?'':'near'}" data-id="${p.id}">${i?'':'① ใกล้สุด · '}${p.s}</button>`).join('')}</div>`}`}
/* ---------- Leaflet + OpenStreetMap (no API key) ---------- */
const TD='M0 0C-5 -9 -13 -15 -13 -23A13 13 0 1 1 13 -23C13 -15 5 -9 0 0Z';
let map=null,layer=null,tl=null;
let ATTR='<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" style="color:inherit">© OpenStreetMap contributors</a>';
let useBase=()=>{};
function initBase(){
const O='© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" style="color:inherit">OpenStreetMap</a> contributors';
const ES='Esri, Maxar, Earthstar Geographics และ GIS User Community';
const AT={osm:O,sat:'ภาพดาวเทียม © '+ES};
const esri=p=>'https://server.arcgisonline.com/ArcGIS/rest/services/'+p+'/MapServer/tile/{z}/{y}/{x}';
const B={osm:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}),
sat:L.tileLayer(esri('World_Imagery'),{maxZoom:19,attribution:'Tiles © Esri'})};
const lab=L.layerGroup([L.tileLayer(esri('Reference/World_Transportation'),{maxZoom:19,zIndex:5}),L.tileLayer(esri('Reference/World_Boundaries_and_Places'),{maxZoom:19,zIndex:6})]);
let cur=null;
const g=$('gm');
function watch(k){const l=B[k];let ok=0,bad=0;
l.on('tileload',()=>{ok++;$('tilemsg').style.display='none'});
l.on('tileerror',()=>{bad++;if(!ok&&bad===6&&cur===k){const m=$('tilemsg');
m.innerHTML=k==='sat'?'โหลดภาพดาวเทียมไม่ได้ ลองใหม่อีกครั้ง หรือสลับกลับเป็นแผนที่ปกติ':'ยังโหลดภาพแผนที่ไม่ได้ ถ้าเปิดไฟล์ในแอปแชทหรือดับเบิลคลิกตรง ๆ ให้เปิดผ่านลิงก์เว็บ (เช่น Netlify Drop) หรือ Live Server แล้วลองใหม่';m.style.display='block'}})}
const watched={};
function use(k){if(cur&&map.hasLayer(B[cur]))map.removeLayer(B[cur]);if(map.hasLayer(lab))map.removeLayer(lab);
cur=k;B[k].addTo(map);if(!watched[k]){watched[k]=1;watch(k)}
g.classList.toggle('base-osm',k==='osm');
document.querySelectorAll('[data-bm]').forEach(b=>b.classList.toggle('on',b.dataset.bm===k));
const lw=$('lbw');lw.classList.toggle('on',k==='sat');$('lbc').checked=false;
ATTR=AT[k]+(k==='sat'?' · '+O:'');const x=$('shb');if(x)x.innerHTML=sheet()}
$('lbc').onchange=e=>{if(e.target.checked)lab.addTo(map);else map.removeLayer(lab)};
useBase=use;use('osm');setTimeout(()=>map.invalidateSize(),400)}
const pinSvg=(fill,w,h,txt)=>`<svg width="${w}" height="${h}" viewBox="-14 -37 28 38" style="display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))"><path d="${TD}" fill="${fill}" stroke="#fff" stroke-width="2"/>${txt?`<text y="-18" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family=""Noto Sans Thai","Sarabun",sans-serif">${txt}</text>`:'<circle cy="-23" r="5" fill="#fff"/>'}</svg>`;
function initMap(){
if(typeof L==='undefined'){const n=$('nokey');n.style.display='flex';
n.innerHTML='<h2>โหลดแผนที่ไม่ได้</h2><p class="sub" style="max-width:340px">ต้องต่ออินเทอร์เน็ตเพื่อโหลด Leaflet และแผนที่ OpenStreetMap</p><button class="btn o" style="max-width:260px" data-t="drv">ดูหน้าคนขับไปก่อน</button>';return}
map=L.map('gm',{center:[18.8,99.0],zoom:11,minZoom:10,maxZoom:18,maxBounds:[[18.58,98.8],[19.0,99.22]],maxBoundsViscosity:.9,zoomAnimation:true,fadeAnimation:true,markerZoomAnimation:true,inertiaDeceleration:2200,easeLinearity:.25,wheelPxPerZoomLevel:90});
initBase();
map.on('click',e=>addPoint(mk(e.latlng.lat,e.latlng.lng)));
layer=L.layerGroup().addTo(map);tl=L.layerGroup().addTo(map);
map.on('moveend',()=>{if(!S.o&&S.tab==='map'){drawTrucks();const x=$('trk');if(x)x.innerHTML=trucksHtml();$('tp').innerHTML=topHtml()}});drawMarkers()}
const TM={};let rc=null,rl=null;
function drawTrucks(){if(!map||!tl)return;const r=ref(),NT=nearTrucks(),best=bestTruck(NT),ids=new Set(NT.map(x=>x.t.i));
if(rc){tl.removeLayer(rc);rc=null}
if(S.o)rc=L.circle([r.la,r.lo],{radius:S.rad,color:'#D42E2B',weight:2,fillColor:'#D42E2B',fillOpacity:.05,interactive:false}).addTo(tl);
const rq=S.req&&TK[S.req.i],rr=rq&&rq.mode==='pickup'&&rq.rt&&S.req.state==='coming'?rq.rt:null;
if(rl&&rl._f!==rr){tl.removeLayer(rl);rl=null}
if(rr&&!rl){rl=L.polyline(rr,{color:'#D42E2B',weight:4,opacity:.75,dashArray:'2 10',lineCap:'round',interactive:false}).addTo(tl);rl._f=rr}
Object.keys(TM).forEach(k=>{if(!ids.has(+k)){tl.removeLayer(TM[k].m);tl.removeLayer(TM[k].c);delete TM[k]}});
NT.forEach(({t})=>{let o=TM[t.i];
if(!o){const m=L.marker([t.la,t.lo],{interactive:false,keyboard:false,zIndexOffset:500,icon:L.divIcon({className:'pin0',html:'<div class="tk"><span class="halo"></span><div class="tkv">'+TRUCK+'</div><span class="tkl"></span></div>',iconSize:[56,34],iconAnchor:[28,17]})}).addTo(tl);
const c=L.circle([t.la,t.lo],{radius:t.acc,color:'#D42E2B',weight:1.5,dashArray:'4 5',fillColor:'#D42E2B',fillOpacity:.1,interactive:false}).addTo(tl);
o=TM[t.i]={m,c,el:m.getElement(),lab:null,w:false};o.lab=o.el&&o.el.querySelector('.tkl')}
if(!o.el)return;
const isB=!!(best&&best.t===t),q=!!(S.req&&S.req.i===t.i);o.isB=isB;
o.el.classList.toggle('best',isB||q);o.el.classList.toggle('busy',!!t.busy);
if(o.lab)o.lab.textContent=(isB?'ใกล้สุด · ':'')+D[t.i].n+' · '+(kmh(t)<1?'จอดรอ':kmh(t)+' กม./ชม.')})}
function drawMarkers(){if(!map)return;layer.clearLayers();
const act=S.dr!==null?D[S.dr].z:null,tp=[S.o,...S.stops].filter(Boolean);
P.forEach(p=>{const m=L.marker([p.la,p.lo],{title:p.th,alt:p.th,opacity:act&&!act.includes(p.id)?.3:1,
icon:L.divIcon({className:'pin0',html:`<div class="pn">${pinSvg('#0F6E73',26,34)}<span class="mlabel">${p.s}</span></div>`,iconSize:[26,34],iconAnchor:[13,34]})});
m.on('click',()=>addPoint(mk(p.la,p.lo,p)));m.addTo(layer)});
if(tp.length>1)L.polyline(tp.map(p=>[p.la,p.lo]),{color:'#D42E2B',weight:4,dashArray:'2 10',lineCap:'round',interactive:false}).addTo(layer);
tp.forEach((p,i)=>L.marker([p.la,p.lo],{interactive:false,zIndexOffset:1000+i,icon:L.divIcon({className:'pin0',html:pinSvg(i?'#D42E2B':'#1E2422',36,48,i?String(i):'A'),iconSize:[36,48],iconAnchor:[18,48]})}).addTo(layer));drawTrucks()}
function fitTrip(){const tp=[S.o,...S.stops].filter(Boolean);if(!map||tp.length<2)return;
map.fitBounds(L.latLngBounds(tp.map(p=>[p.la,p.lo])),{paddingTopLeft:[40,130],paddingBottomRight:[40,Math.round(innerHeight*.5)],maxZoom:15})}
function drvTab(){const f=S.flt,L=D.filter(d=>!f||d.z.includes(f));
return`<div><h1>คนขับวันนี้ขับที่ไหนบ้าง</h1><p class="sub">เลือกพื้นที่เพื่อดูว่าลุงคนไหนวิ่งแถวนั้น (ข้อมูลตัวอย่าง)</p>
<div class="fl"><button class="${!f?'on':''}" data-f="">ทุกพื้นที่</button>${P.map(p=>`<button class="${f===p.id?'on':''}" data-f="${p.id}">${p.s}</button>`).join('')}</div>
${L.map(d=>{const i=D.indexOf(d);return`<div class="card"><div class="dr"><span class="av">${d.n.replace('ลุง','').replace('พี่','').charAt(0)}</span><div class="m"><div class="nm">${d.n}</div><div class="meta">${d.s} ที่นั่ง · ออกวิ่ง ${d.h}</div></div></div>
<div style="margin-top:10px">${d.z.map(z=>`<span class="dc ${z===f?'hit':''}">${get(z).s}</span>`).join('')}</div>
<button class="btn o" data-view="${i}">ดูพื้นที่ของ${d.n}บนแผนที่</button></div>`}).join('')}
<div class="foot">เวลาและพื้นที่เป็นตัวอย่าง ของจริงให้คนขับอัปเดตเองหลังลงทะเบียน</div></div>`}
function regTab(){return`<div><h1>วิธีลงทะเบียนคนขับรถแดง</h1><p class="sub">ลงทะเบียนครั้งเดียว ชื่อและพื้นที่ที่วิ่งจะขึ้นบนบอร์ดคนขับ</p>
<div class="note">ไม่ต้องรับเงินผ่านแอป ผู้โดยสารจ่ายเงินสดกับคุณตามราคากลาง</div>
<ol class="st"><li><b>เตรียมเอกสาร</b><br><span class="meta">ใบขับขี่ ทะเบียนรถ/เอกสารอนุญาตของรถ และรูปถ่ายหน้าตรง</span></li>
<li><b>กรอกข้อมูลและเลือกพื้นที่ที่วิ่ง</b><br><span class="meta">ชื่อที่ผู้โดยสารเห็น จำนวนที่นั่ง จุดรอที่คุณประจำ และเวลาออกวิ่ง</span></li>
<li><b>รับทราบราคากลาง</b><br><span class="meta">ตกลงเก็บตามตารางราคา ไม่ต้องต่อรองหน้างาน</span></li>
<li><b>รอตรวจสอบเอกสาร</b><br><span class="meta">ทีมงานตรวจเอกสารและทะเบียนรถ</span></li>
<li><b>โปรไฟล์ขึ้นบอร์ดคนขับ</b><br><span class="meta">ผู้โดยสารเห็นชื่อ พื้นที่ และเวลาวิ่งของคุณ</span></li></ol>
<a class="btn" href="https://claude.ai/artifact/SYtcz7qZTSykKGuCfwkauJ" target="_blank" rel="noopener">เปิดแบบฟอร์มสมัคร (ต้นแบบ)</a>
<div class="foot">ต้นแบบนี้ยังไม่บันทึกข้อมูลจริง รายการเอกสารที่ต้องใช้จริงต้องยืนยันกับขนส่งจังหวัดเชียงใหม่ก่อน</div></div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
const m=S.tab==='map';$('mapview').style.display=m?'block':'none';$('pg').style.display=m?'none':'block';
if(m){$('tp').innerHTML=topHtml();$('shb').innerHTML=sheet();setSnap(S.snap);if(map){map.invalidateSize();drawMarkers()}}
else{$('pg').innerHTML=S.tab==='drv'?drvTab():regTab();$('pg').scrollTop=0}}
function refresh(){drawMarkers();const sh=$('shb');sh.innerHTML=sheet();sh.scrollTop=0;sh.classList.remove('in');void sh.offsetWidth;sh.classList.add('in')}
const SN=['peek','half','full'];
function snapH(n){const H=$('mapview').clientHeight;return n==='peek'?96:n==='half'?H*.46:H*.86}
function setSnap(n){S.snap=n;const sh=$('sh');if(sh&&$('mapview').clientHeight)sh.style.height=snapH(n)+'px'}
(function(){const g=$('shg'),sh=$('sh');let d=null;
g.addEventListener('pointerdown',e=>{d={y:e.clientY,h:sh.offsetHeight,mv:0};sh.classList.add('drag');g.setPointerCapture(e.pointerId)});
g.addEventListener('pointermove',e=>{if(!d)return;const H=$('mapview').clientHeight,dy=d.y-e.clientY;d.mv=Math.max(d.mv,Math.abs(dy));sh.style.height=Math.max(72,Math.min(H*.9,d.h+dy))+'px'});
const end=()=>{if(!d)return;sh.classList.remove('drag');
if(d.mv<6){setSnap(SN[(SN.indexOf(S.snap)+1)%3])}
else{const h=sh.offsetHeight;setSnap(SN.reduce((b,n)=>Math.abs(snapH(n)-h)<Math.abs(snapH(b)-h)?n:b,'half'))}d=null};
g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setSnap(SN[(SN.indexOf(S.snap)+1)%3])}});
addEventListener('resize',()=>setSnap(S.snap))})();
function addPoint(pt){if(!S.o)S.o=pt;else if(S.stops.length<4)S.stops.push(pt);else S.stops[3]=pt;if(S.snap==='peek')setSnap('half');refresh();fitTrip()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-id],[data-t],[data-add],[data-rm],[data-reset],[data-show],[data-clr],[data-f],[data-view],[data-bm],[data-me],[data-rad],[data-call],[data-cancel],[data-origin]');if(!t)return;
const d=t.dataset;
if(d.t!==undefined){S.tab=d.t;render()}
else if(d.bm)useBase(d.bm);
else if(d.me)useMe();
else if(d.rad){S.rad=+d.rad;upd(1)}
else if(d.call!==undefined)callTruck(+d.call);
else if(d.cancel){S.req=null;upd(1)}
else if(d.origin){const pl=get(d.origin);S.o=mk(pl.la,pl.lo,pl);if(map)map.panTo([pl.la,pl.lo],{duration:.6,easeLinearity:.25});refresh()}
else if(d.id||d.add){const pl=get(d.id||d.add);addPoint(mk(pl.la,pl.lo,pl))}
else if(d.rm!==undefined){S.stops.splice(+d.rm,1);refresh();fitTrip()}
else if(d.reset){S.o=null;S.stops=[];S.req=null;refresh()}
else if(d.show){const tr=trip(),n=S.stops.length;
$('sT').textContent=n===1?'ไป'+S.stops[0].name+' ราคา':'เหมาคัน ลง '+n+' จุด ราคา';
$('sP').textContent='฿'+(n===1?tr.sh:tr.ch);
$('sS').textContent=n===1?'ต่อคน หรือเหมาคัน ฿'+tr.ch:S.stops.map((s,i)=>(i+1)+'. '+s.name).join(' → ');
$('show').classList.add('on')}
else if(d.clr){S.dr=null;render()}
else if(d.f!==undefined){S.flt=d.f||null;render()}
else if(d.view!==undefined){S.dr=+d.view;S.tab='map';render()}});
$('sX').onclick=()=>$('show').classList.remove('on');
render();window.__ok=1;initMap();
</script>
